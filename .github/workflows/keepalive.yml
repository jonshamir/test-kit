# Keeps the free Supabase project awake.
#
# Supabase pauses a free project after about a week with no database
# activity. This calls /api/health twice a week, which runs one tiny
# database query - enough to count as activity.
#
# BEFORE THIS WORKS, add your deployed URL:
#   your repo -> Settings -> Secrets and variables -> Actions
#   -> Variables tab -> New repository variable
#   Name:  DEPLOY_URL
#   Value: https://your-app.your-subdomain.workers.dev
#
# Until you do, the job below skips itself rather than failing, so you
# will not have a red cross on the repo from day one.
#
# Note: GitHub switches scheduled workflows off in a repository with no
# commits for 60 days - exactly the quiet spell this is meant to cover.
# If you are away that long, come back and press "Run workflow" by hand
# to switch it on again.

name: Keep Supabase awake

on:
  schedule:
    # Mondays and Thursdays at 07:00 UTC.
    - cron: "0 7 * * 1,4"
  # Lets you run it yourself from the Actions tab.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.DEPLOY_URL != ''
    steps:
      - name: Call /api/health
        run: |
          echo "Pinging ${{ vars.DEPLOY_URL }}/api/health"
          # --fail makes curl exit non-zero on a 4xx or 5xx, so a broken
          # deployment shows up as a failed run instead of passing quietly.
          curl --fail --silent --show-error --max-time 30 \
            "${{ vars.DEPLOY_URL }}/api/health"
